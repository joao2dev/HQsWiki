services:
  db:
    image: postgres:16
    container_name: hqswiki-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: hqswiki-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
